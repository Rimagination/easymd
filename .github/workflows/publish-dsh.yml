name: publish dsh plugin

# 打 dsh-v* 标签时把 dsh-plugin/ 发布成 npm 包 easymd-dsh。
# 需要仓库 secret NPM_TOKEN（Granular Access Token，允许 easymd-dsh 的 publish）。
on:
  push:
    tags:
      - 'dsh-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#dsh-v}"
          pkg="$(node -p "require('./dsh-plugin/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag dsh-v$tag != dsh-plugin version $pkg" >&2
            exit 1
          fi

      - run: pnpm dsh:pack

      - run: pnpm --dir dsh-plugin publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
