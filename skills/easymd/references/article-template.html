<!-- 文章 HTML 模板 -->
<section
  id="easymd-article"
  style="
    box-sizing: border-box;
    max-width: 680px;
    margin: 0 auto;
    padding: 24px 18px;
    color: #1f2933;
    background: #ffffff;
    font-family:
      -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 16px;
    line-height: 1.8;
  "
>
  <section style="margin: 0 0 28px">
    <p style="margin: 0 0 8px; color: #6b8bb3; font-size: 13px; letter-spacing: 0">EASYMD</p>
    <h1 style="margin: 0; color: #111827; font-size: 28px; line-height: 1.3; font-weight: 800">文章标题</h1>
    <p style="margin: 14px 0 0; color: #52606d">这里放一句导语，说明读者为什么要继续读。</p>
  </section>

  <section
    style="margin: 24px 0; padding: 18px 20px; border-radius: 10px; background: #f6f8fb; border: 1px solid #e4e8f0"
  >
    <p style="margin: 0 0 8px; color: #2f5d8c; font-weight: 700">导读</p>
    <p style="margin: 0; color: #263238; line-height: 1.8">用两三句话概括文章价值、适合读者和可带走的结论。</p>
  </section>

  <section style="margin: 32px 0 16px">
    <p style="margin: 0 0 4px; color: #6b8bb3; font-size: 13px; letter-spacing: 0">SECTION 01</p>
    <h2
      style="
        margin: 0;
        padding-left: 12px;
        border-left: 4px solid #2f5d8c;
        color: #1f2933;
        font-size: 22px;
        line-height: 1.35;
      "
    >
      章节标题
    </h2>
  </section>

  <p style="margin: 0 0 16px; color: #263238; line-height: 1.85">
    正文段落放在这里。每段控制在适合手机阅读的长度，避免连续大段文字压住读者。
  </p>

  <section style="margin: 20px 0; padding: 14px 16px; background: #fff8ed; border-left: 4px solid #d9902f">
    <p style="margin: 0; color: #4a3420; line-height: 1.75">这里放前提、风险、边界或容易忽略的提醒。</p>
  </section>

  <section
    style="
      margin: 28px 0;
      padding: 22px 20px;
      text-align: center;
      border-top: 1px solid #d8dee8;
      border-bottom: 1px solid #d8dee8;
    "
  >
    <p style="margin: 0; color: #1f2933; font-size: 20px; line-height: 1.6; font-weight: 700">
      一句真正能被读者记住的话。
    </p>
  </section>

  <section style="margin: 32px 0 0; padding-top: 18px; border-top: 1px solid #e4e8f0">
    <p style="margin: 0; color: #52606d; line-height: 1.75">
      文末只保留一个行动：继续阅读、留言、收藏、关注或复制某个清单。
    </p>
  </section>
</section>
